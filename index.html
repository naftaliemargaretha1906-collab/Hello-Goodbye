<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Module 4 Solution - Interactive & Fresh UI</title>
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
      color: #334155;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Background Ornaments */
    .bg-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: -1;
      opacity: 0.6;
    }
    .shape-1 {
      width: 300px;
      height: 300px;
      background: #818cf8;
      top: -50px;
      left: -80px;
    }
    .shape-2 {
      width: 350px;
      height: 350px;
      background: #f472b6;
      bottom: -50px;
      right: -80px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
      border: 1px solid #ffffff;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .header p {
      font-size: 14px;
      color: #64748b;
      font-weight: 500;
    }

    /* Input Section */
    .input-box {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }
    .input-box input {
      flex: 1;
      padding: 14px 18px;
      border-radius: 14px;
      border: 2px solid #e2e8f0;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }
    .input-box input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }
    .btn {
      padding: 14px 22px;
      border-radius: 14px;
      border: none;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.35);
    }

    /* Output Grid */
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      max-height: 320px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .results-grid::-webkit-scrollbar {
      width: 6px;
    }
    .results-grid::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }

    .card-item {
      padding: 14px 16px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 14px;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-hello {
      background-color: #f0fdf4;
      color: #15803d;
      border: 1.5px solid #bbf7d0;
    }
    .card-goodbye {
      background-color: #fff1f2;
      color: #be123c;
      border: 1.5px solid #fecdd3;
    }

    .card-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .card-hello .card-icon { background: #dcfce7; }
    .card-goodbye .card-icon { background: #ffe4e6; }

    .note {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #94a3b8;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>

  <div class="container">
    <div class="header">
      <h1>Module 4 Greeting App ✨</h1>
      <p>Checks if name starts with 'J'/'j' & outputs to Console and UI</p>
    </div>

    <!-- Interactive Add Name -->
    <div class="input-box">
      <input type="text" id="nameInput" placeholder="Type a name (e.g. John, Alex)...">
      <button class="btn btn-primary" onclick="addCustomName()">
        <i class="fa-solid fa-plus"></i> Add
      </button>
    </div>

    <!-- Output Cards Grid -->
    <div class="results-grid" id="outputList"></div>

    <p class="note"><i class="fa-solid fa-terminal"></i> Press F12 -> Console to view raw logs</p>
  </div>

  <script src="SpeakHello.js"></script>
  <script src="SpeakGoodBye.js"></script>
  <script src="script.js"></script>

</body>
</html>
